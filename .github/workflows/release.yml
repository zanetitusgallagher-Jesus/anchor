name: Build downloadable app
# Builds a universal (Apple silicon + Intel) Anchor.app on GitHub's macOS
# runners and publishes it as a release, so no local Xcode is needed.
on:
  push:
    branches: [main, "claude/**"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
      - run: xcodegen generate
      - name: Build Release (universal, ad-hoc signed)
        run: |
          set -o pipefail
          xcodebuild -project Anchor.xcodeproj -scheme Anchor -configuration Release \
            -derivedDataPath build -destination 'generic/platform=macOS' \
            ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= \
            build 2>&1 | tee xcodebuild.log | grep -E "error:|\*\* .* \*\*" || true
          grep -q "\*\* BUILD SUCCEEDED \*\*" xcodebuild.log
      - name: Package
        run: |
          APP=build/Build/Products/Release/Anchor.app
          lipo -archs "$APP/Contents/MacOS/Anchor"
          codesign --verify --deep --strict "$APP"
          ditto -c -k --keepParent "$APP" Anchor.zip
          ls -lh Anchor.zip
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Anchor.zip \
            --target "$GITHUB_SHA" \
            --title "Anchor (latest build)" \
            --notes "Built from ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7}. Requires macOS 14 Sonoma or later. See the README section 'Install without Xcode'."
